<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Insert title here</title>
</head>
<body>

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Login</title>
  <link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet"/>
  <link rel="stylesheet" href="HTML/Reg_regenerateotp.css">

</head>
 
  <div class="login-card">
 
    <div class="login-header">
      <h1>Enter  Your OTP </h1>
      <p>Enter 6 Digit Otp</p>
      <div class="accent-bar"></div>
    </div>
 
    <form class="field-group" action="/Form/userregister" method="post" >
     <input type="hidden" name="system_otp" value="<%= s_otp %>">
      <div class="field">
        <label for="email">Email Address <span>*</span></label>
     <b>   <input type="email" id="email" name="useremail" value="<%= mail %>" placeholder="<%= mail %>" readonly="readonly" /></b>
        <span class="hint hint-error">Please enter a valid email address.</span>
        <span class="hint hint-ok">Looks good!</span>
      </div>
      <div class="field">
      <label for="email">Enter Otp <span>*</span></label>
   <div class="pin-row" id="pin-row">
    <input type="text" class="pin-input" maxlength="1" inputmode="numeric" pattern="[0-9]" name="p0">
    <input type="text" class="pin-input" maxlength="1" inputmode="numeric" pattern="[0-9]" name="p1">
    <input type="text" class="pin-input" maxlength="1" inputmode="numeric" pattern="[0-9]" name="p2">
    <input type="text" class="pin-input" maxlength="1" inputmode="numeric" pattern="[0-9]" name="p3">
    <input type="text" class="pin-input" maxlength="1" inputmode="numeric" pattern="[0-9]" name="p4">
    <input type="text" class="pin-input" maxlength="1" inputmode="numeric" pattern="[0-9]" name="p5">
</div>
</div>
      <button type="submit" class="submit-btn" name="submit" value="verifyregotp" id="button-regenerate"><span id="verify-button">Verify</span></button>
 
    </form>
 
    <p class="signup-link">Don't have an account? <a href="Register.jsp">Create one</a></p>
 
  </div>
 

</body>
</html>
