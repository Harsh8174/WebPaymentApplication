
<div class="login-card">
 <div class="login-header">
<h1>Reset Your Password</h1>
      <p>Password Should be of Length 8</p>
      <div class="accent-bar"></div>
      <div></div>
      </div>
<form class="field-group" action="/Form/userregister" method="post">
       <input type="hidden" id="email" name="useremail" value="<%= useremail %>" placeholder="you@example.com" required />
      <div class="field">
        <label for="username">New Password <span>*</span></label>
        <input type="password" id="newpassword" placeholder="Enter your userpassword" maxlength="8" required />
      </div>
      <div class="field">
        <label for="username">Confirm Password <span>*</span></label>
        <input type="password" id="userpassword" name="newpassword" placeholder="Enter your userpassword" maxlength="8" required />
      </div>
      <button type="submit" class="submit-btn" name="submit" value="resetpassword">Reset</button>
      </form>
 </div>
